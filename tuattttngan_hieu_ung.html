<body>
<div id="stage" style="position:relative; width:100%; height:100%;"></div>

<script>
  const stage = document.getElementById('stage');
  const W = window.innerWidth;
  const H = window.innerHeight;

  const titleText = "Tuấtt Ngân ";
  const titleText = "Tuấtt Ngân ";
  const titleText = "Tuấtt Ngân ";


  
  
  const titleEl = document.createElement('div');
  titleEl.className = 'title';
  titleEl.textContent = titleText;
  const tStartX = 20 + Math.random() * (W - 320);
  const tStartY = 20 + Math.random() * (H - 100);
  titleEl.style.left = tStartX + 'px';
  titleEl.style.top = tStartY + 'px';
  titleEl.style.animationDuration = '6s, 6s';
  titleEl.style.animationDelay = '0s, 0s';
  stage.appendChild(titleEl);

  const stickerCount = 7;
  for (let i = 0; i < stickerCount; i++) {
    const el = document.createElement('div');
    el.className = 'sticker';
    const startX = Math.random() * (W - 130);
    const startY = Math.random() * (H - 130) + 60;
    el.style.left = startX + 'px';
    el.style.top = startY + 'px';
    const dur = 4 + Math.random() * 4;
    const delay = Math.random() * 3;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    const size = 80 + Math.random() * 60;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    stage.appendChild(el);
  }

  const colors = ['#ff6ec7','#ffd166','#5df2c9','#7f9cf5','#ffffff'];
  const sparkCount = 30;
  for (let i = 0; i < sparkCount; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 3 + Math.random() * 5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * W) + 'px';
    s.style.top = (Math.random() * H) + 'px';
    s.style.animationDelay = (Math.random() * 2.5) + 's';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    stage.appendChild(s);
  }
</script>
